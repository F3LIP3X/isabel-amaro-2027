<head>

<title>Reservar alojamiento · Isabel y Amaro</title>
<meta name="description" content="Cómo reservar habitación para la boda de Isabel y Amaro: llamad al hotel y decid la frase de la boda.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#363d23">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">

<body>
<main class="reserva">
  <div class="reserva__card">
    <a class="reserva__back" href="index.html#alojamiento"><svg viewBox="0 0 256 256" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>Volver a alojamiento</a>

    <p class="reserva__kicker"><span class="reserva__rombo" aria-hidden="true"></span>Boda de Isabel y Amaro · 3 de abril de 2027</p>
    <h1 class="reserva__title">Reservar alojamiento</h1>
    <p class="reserva__lead">Las reservas se hacen por teléfono, directamente con el hotel.</p>

    <ol class="reserva-pasos">
      <li>Llamad al hotel y pedid una habitación.</li>
      <li>Al hacer la reserva, decid:
        <p class="reserva__frase">«Es para la boda de Isabel y Amaro»</p>
      </li>
    </ol>

    <a class="btn btn--solid reserva__web" id="reservaWeb" href="https://www.brozhostel.es/" target="_blank" rel="noopener" hidden>Abrir la web del hotel</a>
  </div>
  <script>
    // Si se llega desde Broz Hostel, se muestra el botón a su web
    if (new URLSearchParams(location.search).get('hotel') === 'broz') document.getElementById('reservaWeb').hidden = false;
  </script>
</main>
</body>
