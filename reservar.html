<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservar alojamiento · Isabel y Amaro</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#363d23">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main class="section">
  <div class="wrap">
    <header class="section__head">
      <h1 class="section__title">Reservar alojamiento</h1>
    </header>

    <div class="section__body">
      <div class="prose">
        <p class="prose__lead">Para reservar, llamad al hotel.</p>
        <ol class="reserva-pasos">
          <li>Llamad al hotel y pedid una habitación.</li>
          <li>Decid en recepción que la reserva es para la boda de Isabel y Amaro.</li>
        </ol>
      </div>

      <p class="rsvp__note" id="reservaWeb" hidden>Web del hotel: <a class="link" href="https://www.brozhostel.es/" target="_blank" rel="noopener">brozhostel.es</a></p>
      <p class="rsvp__note"><a class="link" href="index.html#alojamiento">Volver a alojamiento</a></p>
      <script>
        // Si se llega desde Broz Hostel, se muestra su web como ayuda extra
        if (new URLSearchParams(location.search).get('hotel') === 'broz') document.getElementById('reservaWeb').hidden = false;
      </script>
    </div>
  </div>
